name: SmartQuail Docker Build Apps qndfinal24600app

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app_test:
    uses: smartquailstage/qndfinal24600app/.github/workflows/app_test.yaml@main

  Docker_container_build:
    runs-on: ubuntu-latest
    needs: [app_test]
    env:
      DJANGO_SECRET_KEY: test-key-not-good

    steps:
      - name: Checkout code
        uses: actions/checkout@v3 

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build container image
        run: | 
          docker build -f Dockerfile               -t smartquail/qndfinal24600app:latest               -t smartquail/qndfinal24600app:${GITHUB_SHA::2}-${GITHUB_RUN_ID::2}               .

      - name: Push Image
        run: | 
          docker push smartquail/qndfinal24600app --all-tags
