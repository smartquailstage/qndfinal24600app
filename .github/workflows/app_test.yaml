name: SmartQuail Django-app & Postgres Test qndfinal24600app

on:
  workflow_call:
  workflow_dispatch:

jobs:
  app_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      PROJECT_NAME: qndfinal24600app
      DJANGO_SECRET_KEY: test-key-not-good
      NAME_DB: QNDFINAL24600APP_STDB
      PASSWORD_DB: Support1719@
      USER_DB: sqadmindb
      HOST_DB: localhost
      PORT_DB: 5432 
      DB_IGNORE_SSL: "true"
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: localhost
      EMAIL_PORT: 587
      EMAIL_HOST_USER: ''
      EMAIL_HOST_PASSWORD: ''
      EMAIL_USE_TLS: 'True'
      EMAIL_USE_SSL: 'False'

    services:
      smartquaildb:
        image: postgres:16-alpine
        env: 
          POSTGRES_DB: QNDFINAL24600APP_STDB
          POSTGRES_PASSWORD: Support1719@
          POSTGRES_USER: sqadmindb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "Django>=5.1,<5.2" gunicorn python-decouple
          if [ -f "requirements.txt" ]; then
            python3 -m pip install -r requirements.txt
          elif [ -f "pk.txt" ]; then
            python3 -m pip install -r pk.txt
          fi

      - name: Run Tests with Django
        run: |
          python3 manage.py test --settings=qndfinal24600app.settings.prod
